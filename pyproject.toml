[project]
name = "ghidra-mcp"
version = "0.2.0"
description = "An MCP server for Ghidra reverse engineering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ghidra-mcp = "ghidra_mcp.server:main"
